name: Plotnine nightly tests

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - name: Install the latest plotnine from main
        run: uv pip install --upgrade "plotnine @ git+https://github.com/has2k1/plotnine.git@main"

      - name: Show plotnine version
        run: uv run --no-sync python -c "import plotnine; print('plotnine', plotnine.__version__)"

      - name: Run Python tests
        run: uv run --no-sync pytest tests/test-python/ -v
