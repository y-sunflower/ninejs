name: Plotnine nightly tests

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - name: Install the latest plotnine pre-release
        run: >-
          uv pip install --upgrade
          --prerelease-package plotnine=allow
          "plotnine>=0.16.0a0"

      - name: Show plotnine version
        run: uv run --no-sync python -c "import plotnine; print('plotnine', plotnine.__version__)"

      - name: Run Python tests
        run: uv run --no-sync pytest tests/test-python/ -v
